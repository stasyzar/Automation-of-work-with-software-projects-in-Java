name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./practice6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Step 1 - Code Style Analysis (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Step 2 - Automated Testing (JUnit 6)
        run: ./gradlew test

      - name: Step 3 - Build JAR Artifact
        run: ./gradlew jar

      - name: Step 4 - Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-jar
          path: practice6/build/libs/*.jar
          retention-days: 7

      - name: Step 5 - Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: practice6/build/libs/*.jar
          body: "Автоматично зібрана версія проєкту. Завантажте .jar файл нижче."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}